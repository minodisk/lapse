[package]
name = "lapse"
version = "0.4.0"
edition = "2021"
description = "CLI that shifts the DateTimeOriginal of burst JPEGs in 1-second steps so Google Photos keeps the shooting order"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
natord = "1.0"
rayon = "1"
tempfile = "3"

[dev-dependencies]
kamadak-exif = "0.6"
image = "0.25"
tempfile = "3"
